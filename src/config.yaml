site:
  name: FlyBird 小郑
  site: 'https://flybirdzhintro.vercel.app'
  base: '/'
  trailingSlash: false
metadata:
  title:
    default: FlyBird 小郑｜海外增长与个人商业合作
    template: '%s — FlyBird 小郑'
  description: 'FlyBird 小郑，分享海外自媒体、个人商业、数字工具与投资成长经验。'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: FlyBird 小郑
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    cardType: summary_large_image
i18n:
  language: zh-CN
  textDirection: ltr
apps:
  blog:
    isEnabled: true
    postsPerPage: 6
    post:
      isEnabled: true
      permalink: '/%slug%'
      robots: { index: true }
    list:
      isEnabled: true
      pathname: 'blog'
      robots: { index: true }
    category:
      isEnabled: true
      pathname: 'category'
      robots: { index: true }
    tag:
      isEnabled: true
      pathname: 'tag'
      robots: { index: false }
    isRelatedPostsEnabled: true
    relatedPostsCount: 4
analytics:
  vendors:
    googleAnalytics:
      id: null
ui:
  theme: 'light'
